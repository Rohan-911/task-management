<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Attachments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(to right, #eef2f7, #f8fafc); font-family: 'Segoe UI', sans-serif; }
        .container { margin-top: 40px; }
        .badge-filter { font-size: 13px; background: #e0f2fe; color: #0369a1; padding: 4px 12px; border-radius: 20px; }
    </style>
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-3 text-center">📎 Attachment List</h2>

    <!-- Filter label (shown when filtering by Task) -->
    <div th:if="${filterLabel}" class="text-center mb-3">
        <span class="badge-filter" th:text="'Filtered by → ' + ${filterLabel}"></span>
    </div>

    <!-- Back / Nav -->
    <div class="mb-3 d-flex gap-2">
        <a href="/attachment" class="btn btn-secondary btn-sm">← Back to Endpoints</a>
        <a href="/attachment/create" class="btn btn-primary btn-sm">+ Add Attachment</a>
        <a href="/attachment/all" class="btn btn-outline-dark btn-sm">All Attachments</a>
    </div>

    <!-- Table -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>File Name</th>
            <th>File Path</th>
            <th>Task ID</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${attachments}">
            <td th:text="${a.attachmentID}"></td>
            <td th:text="${a.fileName}"></td>
            <td th:text="${a.filePath}"></td>
            <td th:text="${a.task?.taskID}"></td>
            <td>
                <a th:href="@{'/attachment/id?id=' + ${a.attachmentID}}"
                   class="btn btn-info btn-sm">View</a>
                <a th:href="@{'/attachment/delete/' + ${a.attachmentID}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this attachment?')">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(attachments)}">
            <td colspan="5" class="text-center text-muted">No attachments found.</td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
