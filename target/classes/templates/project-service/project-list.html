<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Project List</title>
    <style>
        body {
            background-color: #f8f9fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .container-box {
            max-width: 1000px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .method-badge {
            color: green;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #eef2f7;
            text-align: left;
        }

        th {
            background: #f8fafc;
            color: #334155;
        }

        .actions {
            margin-top: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 11px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-main {
            background: #eef2f7;
            color: #334155;
        }

        .btn-nav {
            background: green;
            color: white;
        }

        .btn-disabled {
            background: #cbd5e1;
            color: white;
            pointer-events: none;
        }

        .empty-box {
            padding: 24px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            text-align: center;
            color: #64748b;
        }

        .lookup-box {
            background: #f8fafc;
            border: 1px solid #e5edf5;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
        }

        .lookup-row {
            display: flex;
            gap: 12px;
            align-items: end;
        }

        .lookup-row input {
            flex: 1;
            padding: 11px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container-box">
    <div class="header-row">
        <div>
            <h2 style="margin: 0;" th:text="${pageTitle}">Project List</h2>
            <p style="margin: 6px 0 0; color: #64748b;">
                Total Records: <span th:text="${totalItems}"></span>
            </p>
        </div>
        <div class="method-badge">GET</div>
    </div>

    <div th:if="${showUserSearch}" class="lookup-box">
        <form th:action="@{/ui/users/projects/open}" th:object="${userProjectsSearchRequest}" method="post">
            <label style="display:block; margin-bottom:6px; font-weight:600; color:#334155;">Load Projects By User ID</label>
            <div class="lookup-row">
                <input type="number" th:field="*{userId}" placeholder="Enter user id">
                <button type="submit" class="btn btn-nav">Open</button>
            </div>
        </form>
    </div>

    <div th:if="${hasSearched == true and #lists.isEmpty(projects)}" class="empty-box">
        No projects found for this request.
    </div>

    <table th:if="${hasSearched == true and !#lists.isEmpty(projects)}">
        <thead>
        <tr>
            <th>Project ID</th>
            <th>Project Name</th>
            <th>Description</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>User ID</th>
            <th>User Name</th>
            <th>Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="project : ${projects}">
            <td th:text="${project.projectId}"></td>
            <td th:text="${project.projectName}"></td>
            <td th:text="${project.description != null && !project.description.isBlank() ? project.description : 'No description'}"></td>
            <td th:text="${project.startDate}"></td>
            <td th:text="${project.endDate != null ? project.endDate : 'Not set'}"></td>
            <td th:text="${project.userId != null ? project.userId : 'Not assigned'}"></td>
            <td th:text="${project.userName != null ? project.userName : 'Not assigned'}"></td>
            <td>
                <a th:href="@{/ui/project/{projectId}(projectId=${project.projectId})}" style="text-decoration:none; color:green; font-weight:600;">Open</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${hasSearched == true}" class="actions">
        <div>
            <a th:href="@{/ui/projects/dashboard}" class="btn btn-main">Dashboard</a>
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
            <a th:href="${previousPageUrl}"
               th:classappend="${!hasPrevious} ? ' btn-disabled' : ''"
               class="btn btn-nav">Previous</a>
            <span style="color:#475569;">Page <span th:text="${currentPage}"></span> of <span th:text="${totalPages}"></span></span>
            <a th:href="${nextPageUrl}"
               th:classappend="${!hasNext} ? ' btn-disabled' : ''"
               class="btn btn-nav">Next</a>
        </div>
    </div>
</div>
</body>
</html>
