<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">

<div th:fragment="content">

    <div style="max-width:500px; margin:auto;">

        <h3 style="text-align:center; color:#1e293b; font-weight:700;">Assign Roles</h3>
        <p style="text-align:center; color:#64748b; margin-bottom:20px;">
            User: <b th:text="${user.username}"></b> (ID: <span th:text="${user.userId}"></span>)
        </p>

        <form th:action="@{'/assign-roles/' + ${user.userId}}" method="post"
              style="background:white; padding:25px; border-radius:10px; box-shadow:0 4px 6px rgba(0,0,0,0.05);">

            <label style="color:#475569; font-weight:600; font-size:14px; margin-bottom:10px; display:block;">Select Roles</label>
            
            <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px; background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0;">
                <label th:each="role : ${allRoles}" style="display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:500; color:#334155;">
                    <input type="checkbox" name="roles"
                           th:value="${role}"
                           th:checked="${user.roles.contains(role)}"
                           style="width:18px; height:18px; accent-color:#8b5cf6; cursor:pointer;">
                    <span th:text="${role}"></span>
                </label>
            </div>

            <button type="submit" style="width:100%; background:linear-gradient(135deg,#16a34a,#059669); color:white;
                           padding:12px; border:none; border-radius:6px; cursor:pointer; font-weight:600; font-size:15px;">
                Save Assigned Roles
            </button>
            
            <a href="/assign-roles-by-id" style="display:block; text-align:center; margin-top:15px; color:#64748b; text-decoration:none; font-weight:500; font-size:14px;">
                ← Back to User ID search
            </a>
        </form>

    </div>

</div>
</html>
