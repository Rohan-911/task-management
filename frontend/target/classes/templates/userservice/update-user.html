<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body th:replace="~{userservice/layout :: layout(~{::content})}">

<div th:fragment="content">

    <!-- 🔷 PAGE STYLE -->
    <div style="max-width:600px; margin:auto; margin-top:40px;">

        <div style="background:#fff; padding:30px; border-radius:12px;
                    box-shadow:0 4px 20px rgba(0,0,0,0.1);">

            <h3 style="text-align:center; font-weight:700; margin-bottom:25px;">
                Update User
            </h3>

            <!-- ❗ ERROR MESSAGE -->
            <div th:if="${error}"
                 style="background:#f8d7da; color:#842029;
                        padding:10px; border-radius:6px; margin-bottom:15px;">
                <span th:text="${error}"></span>
            </div>

            <!-- FORM -->
            <form th:action="@{/api/users/{id}/edit(id=${user.userId})}"
                  method="post"
                  th:object="${user}">

                <!-- 🔥 REQUIRED -->
                <input type="hidden" th:field="*{userId}">

                <!-- USERNAME -->
                <label style="font-weight:600;">Username</label>
                <input th:field="*{username}"
                       placeholder="Enter Username"
                       style="width:100%; padding:10px; border-radius:6px;
                              border:1px solid #ccc; margin-bottom:5px;">
                <div style="color:red; font-size:13px; margin-bottom:10px;"
                     th:errors="*{username}"></div>

                <input type="hidden" name="password" value="dummy">

                <!-- EMAIL -->
                <label style="font-weight:600;">Email</label>
                <input th:field="*{email}"
                       placeholder="example@gmail.com"
                       style="width:100%; padding:10px; border-radius:6px;
                              border:1px solid #ccc; margin-bottom:5px;">
                <div style="color:red; font-size:13px; margin-bottom:10px;"
                     th:errors="*{email}"></div>

                <!-- FULL NAME -->
                <label style="font-weight:600;">Full Name</label>
                <input th:field="*{fullName}"
                       placeholder="Enter Full Name"
                       style="width:100%; padding:10px; border-radius:6px;
                              border:1px solid #ccc; margin-bottom:5px;">
                <div style="color:red; font-size:13px; margin-bottom:15px;"
                     th:errors="*{fullName}"></div>

                <!-- BUTTON -->
                <button type="submit"
                        style="width:100%; padding:12px;
                               background:#0d6efd; color:white;
                               border:none; border-radius:8px;
                               font-weight:600; font-size:16px;">
                    Update User
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
