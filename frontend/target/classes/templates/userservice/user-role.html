<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{userservice/layout :: layout(~{::content})}">

<div th:fragment="content">

    <h3>Filter Users by Role</h3>

    <form action="/user-role/result" method="get">

        <input name="role" placeholder="Enter role"
               style="padding:8px; border-radius:6px;">

        <button style="background:#f59e0b; color:white;
                       padding:8px; border:none; border-radius:6px;">
            Search
        </button>
    </form>

    <table th:if="${users}" style="margin-top:20px; width:100%;">

        <tr th:each="u : ${users}">
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
        </tr>

    </table>

    <!-- PAGINATION -->
    <div th:if="${totalPages != null && totalPages > 1}" style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; padding:10px 0;">
        <div style="color:#64748b; font-size:14px; font-weight:500;">
            Showing page <b th:text="${currentPage + 1}"></b> of <b th:text="${totalPages}"></b>
        </div>
        <div style="display:flex; gap:10px;">
            <a th:if="${currentPage > 0}" th:href="@{'/user-role/result?role=' + ${searchParam} + '&page=' + ${currentPage - 1}}" 
               style="padding:8px 16px; background:white; border:1px solid #cbd5e1; border-radius:6px; color:#475569; text-decoration:none; font-size:14px; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.05); transition:all 0.2s;"
               onmouseover="this.style.background='#f8fafc';" onmouseout="this.style.background='white';">
                Previous
            </a>
            
            <a th:if="${currentPage < totalPages - 1}" th:href="@{'/user-role/result?role=' + ${searchParam} + '&page=' + ${currentPage + 1}}" 
               style="padding:8px 16px; background:white; border:1px solid #cbd5e1; border-radius:6px; color:#475569; text-decoration:none; font-size:14px; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.05); transition:all 0.2s;"
               onmouseover="this.style.background='#f8fafc';" onmouseout="this.style.background='white';">
                Next
            </a>
        </div>
    </div>

</div>
</html>
