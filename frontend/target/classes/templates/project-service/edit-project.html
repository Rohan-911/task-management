<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Project</title>
    <style>
        body {
            background-color: #f8f9fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .container-box {
            max-width: 760px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .method-badge {
            color: orange;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .error {
            color: #d62828;
            font-size: 14px;
            margin-top: 6px;
        }

        .error-box {
            background: #fff1f1;
            border: 1px solid #ffd2d2;
            color: #b42318;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 18px;
            border-radius: 10px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: orange;
            color: white;
        }

        .btn-secondary {
            background: #eef2f7;
            color: #334155;
        }
    </style>
</head>
<body>
<div class="container-box">
    <div class="header-row">
        <div>
            <h2 style="margin: 0;">Edit Project</h2>
            <p style="margin: 6px 0 0; color: #64748b;">Full update form using PUT.</p>
        </div>
        <div class="method-badge">PUT</div>
    </div>

    <div th:if="${formError}" class="error-box" th:text="${formError}"></div>

    <form th:action="@{/ui/projects/edit/{projectId}(projectId=${projectId})}" th:object="${projectRequestDto}" method="post">
        <div class="grid">
            <div>
                <label class="label">Project ID</label>
                <input type="number" th:field="*{projectId}" readonly>
            </div>

            <div>
                <label class="label">User ID</label>
                <input type="number" th:field="*{userId}" placeholder="Enter user id">
            </div>

            <div>
                <label class="label">Project Name *</label>
                <input type="text" th:field="*{projectName}" placeholder="Enter project name">
                <div class="error" th:if="${#fields.hasErrors('projectName')}" th:errors="*{projectName}"></div>
            </div>

            <div>
                <label class="label">Start Date *</label>
                <input type="date" th:field="*{startDate}">
                <div class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
            </div>

            <div>
                <label class="label">End Date</label>
                <input type="date" th:field="*{endDate}">
                <div class="error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
            </div>

            <div class="full-width">
                <label class="label">Description</label>
                <textarea th:field="*{description}" placeholder="Enter description"></textarea>
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Update Project</button>
            <a th:href="@{/ui/projects/dashboard}" class="btn btn-secondary">Dashboard</a>
        </div>
    </form>
</div>
</body>
</html>
