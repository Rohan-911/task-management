<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tasks By Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">

        <h3>Get Tasks By Project ID</h3>

        <!-- FORM -->
        <form th:action="@{/tasks/project}" method="get" class="d-flex mb-3">
            <input type="number" name="projectId" class="form-control me-2" placeholder="Enter Project ID" required>
            <button class="btn btn-primary">Search</button>
        </form>

        <!-- RESULT TABLE -->
        <table class="table table-bordered" th:if="${tasks}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Priority</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${tasks}">
                    <td th:text="${t.taskID}"></td>
                    <td th:text="${t.taskName}"></td>
                    <td th:text="${t.status}"></td>
                    <td th:text="${t.priority}"></td>
                </tr>
            </tbody>
        </table>

    </div>
</div>

</body>
</html>
