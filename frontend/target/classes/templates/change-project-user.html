<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Change Project User</title>
    <style>
        body { background-color: #f8f9fb; font-family: 'Segoe UI', sans-serif; }
        .container-box { max-width: 620px; margin: 50px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .method-badge { color: purple; font-weight: 700; }
        .label { display: block; margin-bottom: 6px; font-weight: 600; color: #334155; }
        input { width: 100%; padding: 12px; border: 1px solid #dbe2ea; border-radius: 10px; box-sizing: border-box; margin-bottom: 16px; }
        .btn { padding: 12px 18px; border-radius: 10px; text-decoration: none; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: purple; color: white; }
        .btn-secondary { background: #eef2f7; color: #334155; }
        .actions { display: flex; gap: 12px; margin-top: 18px; }
    </style>
</head>
<body>
<div class="container-box">
    <div class="header-row">
        <div>
            <h2 style="margin: 0;">Change Project User</h2>
            <p style="margin: 6px 0 0; color: #64748b;">Enter both IDs to test the backend path variables without editing the URL manually.</p>
        </div>
        <div class="method-badge">PATCH</div>
    </div>

    <form th:action="@{/ui/projects/change-user}" th:object="${changeUserRequest}" method="post">
        <label class="label">Project ID *</label>
        <input type="number" th:field="*{projectId}" placeholder="Enter project id">

        <label class="label">User ID *</label>
        <input type="number" th:field="*{userId}" placeholder="Enter user id">

        <div class="actions">
            <button type="submit" class="btn btn-primary">Change Project User</button>
            <a th:href="@{/ui/projects/dashboard}" class="btn btn-secondary">Dashboard</a>
        </div>
    </form>
</div>
</body>
</html>
