<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Create Comment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(to right, #eef2f7, #f8fafc); font-family: 'Segoe UI', sans-serif; }
        .form-box {
            max-width: 520px;
            margin: 60px auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }
        .form-title { font-weight: 700; color: #1e293b; margin-bottom: 24px; }
    </style>
</head>

<body>

<div class="form-box">
    <h4 class="form-title">💬 Create Comment</h4>

    <!-- Error Alert -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- POST /api/comments -->
    <form method="post" action="/comment/create" th:object="${comment}">

        <div class="mb-3">
            <label class="form-label">Comment Text</label>
            <textarea class="form-control" name="content" rows="3" placeholder="Enter comment..." required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Task ID</label>
            <input type="number" class="form-control" name="taskID" placeholder="e.g. 1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">User ID</label>
            <input type="number" class="form-control" name="userID" placeholder="e.g. 1" required>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save Comment</button>
            <a href="/comment/all" class="btn btn-secondary">Cancel</a>
        </div>

    </form>
</div>

</body>
</html>
