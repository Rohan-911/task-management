<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Attachment Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(to right, #eef2f7, #f8fafc); font-family: 'Segoe UI', sans-serif; }
        .detail-box {
            max-width: 560px;
            margin: 60px auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }
        .detail-title { font-weight: 700; color: #1e293b; margin-bottom: 24px; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .info-label { font-weight: 600; color: #64748b; }
        .info-value { color: #1e293b; }
    </style>
</head>

<body>

<div class="detail-box">
    <h4 class="detail-title">📎 Attachment Details</h4>

    <!-- GET /api/attachments/{id} -->
    <!-- Search Form -->
    <form method="get" action="/attachment/id" class="d-flex mb-4 gap-2">
        <input type="number" class="form-control" name="id" placeholder="Enter Attachment ID" required>
        <button type="submit" class="btn btn-primary">Fetch</button>
    </form>

    <!-- Result Card -->
    <div th:if="${attachment}">
        <div class="info-row">
            <span class="info-label">Attachment ID</span>
            <span class="info-value" th:text="${attachment.attachmentID}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">File Name</span>
            <span class="info-value" th:text="${attachment.fileName}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">File Path</span>
            <span class="info-value" th:text="${attachment.filePath}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Task ID</span>
            <span class="info-value" th:text="${attachment.task?.taskID}"></span>
        </div>

        <div class="mt-3 d-flex gap-2">
            <a th:href="@{'/attachment/delete/' + ${attachment.attachmentID}}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Delete this attachment?')">Delete</a>
            <a href="/attachment/all" class="btn btn-secondary btn-sm">Back to List</a>
        </div>
    </div>

    <div th:unless="${attachment}" class="text-muted mt-3">
        Enter an ID above to fetch attachment details.
    </div>
</div>

</body>
</html>
