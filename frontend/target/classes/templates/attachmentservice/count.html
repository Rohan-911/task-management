<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Attachment Count</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(to right, #eef2f7, #f8fafc); font-family: 'Segoe UI', sans-serif; }
        .result-box {
            max-width: 480px;
            margin: 60px auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
            text-align: center;
        }
        .count-badge {
            display: inline-block;
            font-size: 48px;
            font-weight: 700;
            color: #7c3aed;
            background: #ede9fe;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            line-height: 100px;
            margin: 20px auto;
        }
    </style>
</head>

<body>

<div class="result-box">
    <h4 class="mb-2" style="font-weight:700; color:#1e293b;">📎 Attachment Count</h4>
    <p class="text-muted">GET /api/attachments/count/{taskId}</p>

    <!-- Search Form -->
    <form method="get" action="/attachment/count" class="d-flex mb-4 gap-2 justify-content-center">
        <input type="number" class="form-control" name="taskId" placeholder="Enter Task ID" required>
        <button type="submit" class="btn btn-primary">Count</button>
    </form>

    <!-- Result -->
    <div th:if="${count != null}">
        <div class="count-badge" th:text="${count}"></div>
        <p class="mt-2 text-muted">attachment(s) found for this task.</p>
    </div>

    <div class="mt-3">
        <a href="/attachment" class="btn btn-secondary btn-sm">← Back to Endpoints</a>
    </div>
</div>

</body>
</html>
