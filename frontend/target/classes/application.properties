# ==============================================================
#  FRONTEND — application.properties  (LOCAL TESTING)
#  Spring Boot 3.2.0 | Port: 8081 | Thymeleaf | RestClient
#  Communicates with Backend at http://localhost:8080
# ==============================================================

spring.application.name=frontend

# ──────────────────────────────────────────
#  SERVER
# ──────────────────────────────────────────

# Frontend on 8081 — Backend runs on 8080
server.port=8081

# ──────────────────────────────────────────
#  THYMELEAF
# ──────────────────────────────────────────

# Disable caching — changes show immediately without restart
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ──────────────────────────────────────────
#  SPRING MVC
# ──────────────────────────────────────────

# Serve static files (CSS, JS, images) from /static
spring.web.resources.add-mappings=true

# Support hidden _method field for PUT/DELETE from HTML forms
spring.mvc.hiddenmethod.filter.enabled=true

# ──────────────────────────────────────────
#  DEVTOOLS  (auto-restart + live reload)
# ──────────────────────────────────────────

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ──────────────────────────────────────────
#  ERROR HANDLING
# ──────────────────────────────────────────

# Show full error details in browser during local dev
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# ──────────────────────────────────────────
#  LOGGING
# ──────────────────────────────────────────

logging.level.com.frontend=DEBUG
logging.level.org.springframework.web=INFO
# See RestClient HTTP calls and responses
logging.level.org.springframework.web.client=DEBUG

# ──────────────────────────────────────────
#  NOTES FOR LOCAL TESTING
#  1. Start Backend first  : mvn spring-boot:run (port 8080)
#  2. Start Frontend second : mvn spring-boot:run (port 8081)
#  3. Open browser         : http://localhost:8081
#
#  All REST calls go to:   http://localhost:8080/api/...
# ──────────────────────────────────────────
