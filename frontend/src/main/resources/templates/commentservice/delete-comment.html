<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Delete Comment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(to right, #eef2f7, #f8fafc); font-family: 'Segoe UI', sans-serif; }
        .form-box {
            max-width: 480px;
            margin: 60px auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
            text-align: center;
        }
        .form-title { font-weight: 700; color: #991b1b; margin-bottom: 16px; }
    </style>
</head>

<body>

<div class="form-box">
    <h4 class="form-title">🗑️ Delete Comment</h4>
    <p class="text-muted mb-4">Enter the Comment ID to delete. This action cannot be undone.</p>

    <!-- DELETE /api/comments/{id} — uses GET redirect via controller -->
    <form method="get" action="#" id="deleteForm">
        <div class="mb-3">
            <input type="number" class="form-control text-center" id="commentIdInput"
                   placeholder="Enter Comment ID" required>
        </div>
        <div class="d-flex gap-2 justify-content-center">
            <button type="button" class="btn btn-danger"
                    onclick="confirmDelete()">Delete</button>
            <a href="/comment/all" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
    function confirmDelete() {
        const id = document.getElementById('commentIdInput').value;
        if (!id) { alert('Please enter a Comment ID.'); return; }
        if (confirm('Delete comment #' + id + '? This cannot be undone.')) {
            window.location.href = '/comment/delete/' + id;
        }
    }
</script>

</body>
</html>
