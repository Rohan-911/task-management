<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Comments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(to right, #eef2f7, #f8fafc); font-family: 'Segoe UI', sans-serif; }
        .container { margin-top: 40px; }
        .badge-filter { font-size: 13px; background: #e0f2fe; color: #0369a1; padding: 4px 12px; border-radius: 20px; }
    </style>
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-3 text-center">💬 Comment List</h2>

    <!-- Error Alert -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Filter label (shown when filtering by Task/User) -->
    <div th:if="${filterLabel}" class="text-center mb-3">
        <span class="badge-filter" th:text="'Filtered by → ' + ${filterLabel}"></span>
    </div>

    <!-- Back / Nav -->
    <div class="mb-3 d-flex gap-2 align-items-center">
        <a href="/comment" class="btn btn-secondary btn-sm">← Back to Endpoints</a>
        <a href="/comment/create" class="btn btn-primary btn-sm">+ Add Comment</a>
        <a href="/comment/all" class="btn btn-outline-dark btn-sm">All Comments</a>
        <div class="ms-auto">
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>

    <!-- Table -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Content</th>
            <th>Task ID</th>
            <th>User ID</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${comments}">
            <td th:text="${c.commentID}"></td>
            <td th:text="${c.content}"></td>
            <td th:text="${c.taskID}"></td>
            <td th:text="${c.userID}"></td>
            <td>
                <a th:href="@{'/comment/id?id=' + ${c.commentID}}"
                   class="btn btn-info btn-sm">View</a>
                <a th:href="@{'/comment/delete/' + ${c.commentID}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this comment?')">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(comments)}">
            <td colspan="5" class="text-center text-muted">No comments found.</td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination Controls -->
    <nav th:if="${totalPages > 0}" aria-label="Page navigation" class="mt-4">
        <ul class="pagination justify-content-center">
            <!-- Previous -->
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/comment/all(page=${currentPage - 1}, size=${size})}">Previous</a>
            </li>

            <!-- Page Numbers -->
            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${pageNum == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/comment/all(page=${pageNum}, size=${size})}" th:text="${pageNum + 1}"></a>
            </li>

            <!-- Next -->
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/comment/all(page=${currentPage + 1}, size=${size})}">Next</a>
            </li>
        </ul>
        <p class="text-center text-muted small" th:text="'Total Elements: ' + ${totalElements} + ' | Page ' + (${currentPage} + 1) + ' of ' + ${totalPages}"></p>
    </nav>

</div>

</body>
</html>
