<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .box {
            max-width: 500px;
            margin: 120px auto;
            padding: 30px;
            border-radius: 15px;
            background: #1e293b;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .code {
            font-size: 60px;
            color: #ef4444;
            font-weight: bold;
        }

        .msg {
            margin-top: 10px;
            color: #cbd5e1;
        }
    </style>
</head>

<body>

<div class="box">
    <div class="code">403</div>
    <h3>Access Denied 🚫</h3>
    <p class="msg">You are not authorized to perform this action.</p>

    <a href="/tasks/task-endpoints" class="btn btn-light mt-3"> Go Back</a>
</div>

</body>
</html>
