<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Project Details</title>
    <style>
        body {
            background-color: #f8f9fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .container-box {
            max-width: 760px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .method-badge {
            color: green;
            font-weight: 700;
        }

        .card {
            background: #f8fafc;
            border: 1px solid #e5edf5;
            border-radius: 14px;
            padding: 22px;
        }

        .row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #edf2f7;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            width: 170px;
            font-weight: 600;
            color: #334155;
        }

        .value {
            flex: 1;
            color: #475569;
        }

        .actions {
            margin-top: 22px;
            display: flex;
            gap: 12px;
        }

        .lookup-box {
            background: #f8fafc;
            border: 1px solid #e5edf5;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
        }

        .lookup-row {
            display: flex;
            gap: 12px;
            align-items: end;
        }

        .lookup-row input {
            flex: 1;
            padding: 11px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
        }

        .btn {
            padding: 11px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-primary {
            background: orange;
            color: white;
        }

        .btn-secondary {
            background: #eef2f7;
            color: #334155;
        }
    </style>
</head>
<body>
<div class="container-box">
    <div class="header-row">
        <div>
            <h2 style="margin: 0;">Project Details</h2>
            <p style="margin: 6px 0 0; color: #64748b;">Single project response shown in card format.</p>
        </div>
        <div class="method-badge">GET</div>
    </div>

    <div class="lookup-box">
        <form id="projectLookupForm" th:action="@{/ui/projects/open}" method="post">
            <label id="projectLookupLabel" class="label">Try Another Project ID</label>
            <div class="lookup-row">
                <input id="projectLookupInput" type="number" name="projectId" placeholder="Enter project id">
                <button type="submit" class="btn btn-primary">Open</button>
            </div>
        </form>
    </div>

    <div th:if="${project}" class="card">
        <div class="row">
            <div class="label">Project ID</div>
            <div class="value" th:text="${project.projectId}"></div>
        </div>
        <div class="row">
            <div class="label">Project Name</div>
            <div class="value" th:text="${project.projectName}"></div>
        </div>
        <div class="row">
            <div class="label">Description</div>
            <div class="value" th:text="${project.description != null and !#strings.isEmpty(project.description) ? project.description : 'No description'}"></div>
        </div>
        <div class="row">
            <div class="label">Start Date</div>
            <div class="value" th:text="${project.startDate}"></div>
        </div>
        <div class="row">
            <div class="label">End Date</div>
            <div class="value" th:text="${project.endDate != null ? project.endDate : 'Not set'}"></div>
        </div>
        <div class="row">
            <div class="label">User ID</div>
            <div class="value" th:text="${project.userId != null ? project.userId : 'Not assigned'}"></div>
        </div>
        <div class="row">
            <div class="label">User Name</div>
            <div class="value" th:text="${project.userName != null ? project.userName : 'Not assigned'}"></div>
        </div>
    </div>

    <div th:if="${project}" class="actions">
        <a th:href="@{/ui/projects/{projectId}/edit(projectId=${project.projectId})}" class="btn btn-primary">Open PUT Form</a>
        <a th:href="@{/ui/projects/dashboard}" class="btn btn-secondary">Back To Dashboard</a>
    </div>
</div>
<script>
    (function () {
        var isLatestProjectPage = window.location.pathname.indexOf('/projects/latest') !== -1;
        var form = document.getElementById('projectLookupForm');
        var label = document.getElementById('projectLookupLabel');
        var input = document.getElementById('projectLookupInput');

        if (isLatestProjectPage) {
            form.action = '/ui/users/projects/latest';
            label.textContent = 'Get Latest Project By User ID';
            input.name = 'userId';
            input.placeholder = 'Enter user id';
        }
    })();
</script>
</body>
</html>
