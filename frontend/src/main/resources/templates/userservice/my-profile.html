<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{userservice/layout :: layout(~{::content})}">

<div th:fragment="content">

    <div style="max-width:600px; margin:40px auto; background:white; padding:30px; 
                border-radius:12px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);">

        <h3 style="margin-bottom:5px; font-weight:700; color:#1e293b;">My Profile</h3>
        <p style="color:#64748b; margin-bottom:20px;">View and update your personal details.</p>

        <!-- Dynamic Success/Error Banners -->
        <div th:if="${success}" style="background:#dcfce7; color:#15803d; padding:12px 20px; border-radius:8px; margin-bottom:20px; border-left:4px solid #22c55e;" th:text="${success}">
        </div>
        <div th:if="${error}" style="background:#fee2e2; color:#b91c1c; padding:12px 20px; border-radius:8px; margin-bottom:20px; border-left:4px solid #ef4444;" th:text="${error}">
        </div>

        <form th:action="@{/current-user}" th:object="${user}" method="post">
            
            <div style="margin-bottom:15px;">
                <label style="font-weight:600; color:#475569; margin-bottom:5px; display:block;">Username</label>
                <input type="text" th:field="*{username}" class="form-control" style="border-radius:8px; padding:10px;" required>
            </div>

            <div style="margin-bottom:15px;">
                <label style="font-weight:600; color:#475569; margin-bottom:5px; display:block;">Email Address</label>
                <input type="email" th:field="*{email}" class="form-control" style="border-radius:8px; padding:10px;" required>
            </div>

            <div style="margin-bottom:15px;">
                <label style="font-weight:600; color:#475569; margin-bottom:5px; display:block;">Full Name</label>
                <input type="text" th:field="*{fullName}" class="form-control" style="border-radius:8px; padding:10px;" required>
            </div>

            <div style="margin-bottom:20px;">
                <label style="font-weight:600; color:#475569; margin-bottom:5px; display:block;">New Password (Optional)</label>
                <input type="password" th:field="*{password}" class="form-control" style="border-radius:8px; padding:10px;" placeholder="Leave blank to keep current password">
            </div>

            <button type="submit" style="width:100%; background:linear-gradient(135deg,#3b82f6,#2563eb); color:white; border:none; padding:12px; border-radius:8px; font-weight:600; cursor:pointer; transition:all 0.2s;">
                Save Changes
            </button>
        </form>

    </div>

</div>
</html>
