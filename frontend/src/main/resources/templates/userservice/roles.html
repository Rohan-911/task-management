<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{userservice/layout :: layout(~{::content})}">

<div th:fragment="content">

    <h3>All Roles</h3>

    <div style="margin-top:15px;">

        <span th:each="r : ${roles}"
              style="background:#e0f2fe; padding:6px 12px;
                     border-radius:20px; margin:5px; display:inline-block;">
            <span th:text="${r}"></span>
        </span>

    </div>

</div>
</html>
