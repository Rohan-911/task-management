<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Error</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .error-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
        }

        .error-code {
            font-size: 60px;
            color: #ef4444;
            font-weight: bold;
        }

        .error-message {
            margin-top: 10px;
            font-size: 18px;
            color: #cbd5f5;
        }

        .btn-back {
            margin-top: 20px;
            background: #64748b;
            border: none;
        }
    </style>
</head>

<body>

<div class="error-card">

    <div class="error-code">⚠️</div>

    <h3>Error</h3>

    <p class="error-message" th:text="${errorMessage}">
        Error message
    </p>

    <a href="/tasks/task-endpoints" class="btn btn-back">Go Back</a>

</div>

</body>
</html>
