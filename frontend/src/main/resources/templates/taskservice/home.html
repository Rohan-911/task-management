<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Home - Team</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #eef2f7, #f8fafc);
            font-family: 'Segoe UI', sans-serif;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 30px;
        }

        .header h2 {
            font-weight: 700;
            font-size: 32px;
            color: #1e293b;
        }

        .header p {
            color: #64748b;
            font-size: 15px;
        }

        /* CARD */
        .card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        /* IMAGE */
        .card img {
            height: 180px;
            object-fit: contain;
            padding: 20px;
        }

        /* BODY */
        .card-body {
            text-align: center;
            padding-bottom: 25px;
        }

        .card-title {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 18px;
        }

        .role {
            font-size: 13px;
            color: #64748b;
        }

        /* LINK RESET */
        a {
            text-decoration: none;
            color: inherit;
        }

        /* GRID SPACING */
        .row {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h2>Task Management Project Team</h2>
        <p>Select a module to explore its features</p>
    </div>

    <!-- CARDS -->
    <div class="row g-4 justify-content-center">

        <!-- USER MODULE -->
        <div class="col-md-4">
            <a th:href="@{/login}">
                <div class="card text-center p-3">

                    <img src="/images/user.png" alt="User">

                    <div class="card-body">
                        <h5 class="card-title">User Module</h5>
                        <p class="role">Authentication & user management</p>
                    </div>

                </div>
            </a>
        </div>

        <!-- TASK MODULE -->
        <div class="col-md-4">
            <a th:href="@{/task}">
                <div class="card">

                    <img src="/images/task.jpg" alt="Task">

                    <div class="card-body">
                        <h5 class="card-title">Task Module</h5>
                        <p class="role">Manage tasks efficiently</p>
                    </div>

                </div>
            </a>
        </div>

        <!-- PROJECT MODULE -->
        <div class="col-md-4">
            <a th:href="@{/project}">
                <div class="card">

                    <img src="/images/project.jpg" alt="Project">

                    <div class="card-body">
                        <h5 class="card-title">Project Module</h5>
                        <p class="role">Track project progress</p>
                    </div>

                </div>
            </a>
        </div>

        <!-- COMMENT MODULE -->
        <div class="col-md-4">
            <a th:href="@{/comment}">
                <div class="card">

                    <img src="/images/comment.jpg" alt="Comment">

                    <div class="card-body">
                        <h5 class="card-title">Comment Module</h5>
                        <p class="role">Collaborate & discuss tasks</p>
                    </div>

                </div>
            </a>
        </div>

        <!-- NOTIFICATION MODULE -->
        <div class="col-md-4">
            <a th:href="@{/category/}">
                <div class="card">

                    <img src="/images/notification.jpg" alt="Notification">

                    <div class="card-body">
                        <h5 class="card-title">Notification Module</h5>
                        <p class="role">Real-time alerts system</p>
                    </div>

                </div>
            </a>
        </div>

    </div>

</div>

</body>
</html>
