<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Tasks By Project</title>

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .container-box {
            max-width: 900px;
            margin: 60px auto;
        }

        .card-dark {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h3 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Input */
        .form-control {
            background: #334155;
            border: none;
            color: white;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus {
            background: #334155;
            color: white;
            box-shadow: none;
            border: 1px solid #3b82f6;
        }

        /* Remove arrows */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none !important;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield !important;
        }

        /* Table */
        .table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .table thead {
            background: #1f2937;
            color: white;
        }

        .table tbody tr:hover {
            background: #f1f5f9;
        }

        /* Status badges */
        .status {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .pending {
            background: #d1fae5;
            color: #065f46;
        }

        .progress {
            background: #fef3c7;
            color: #92400e;
        }

        .completed {
            background: #bfdbfe;
            color: #1e3a8a;
        }

        /* Buttons */
        .btn-primary {
            background: #2563eb;
            border: none;
        }

        .btn-secondary {
            background: #64748b;
            border: none;
        }

        .btn-secondary:hover {
            background: #475569;
        }
    </style>
</head>

<body>

<div class="container-box">

    <div class="card-dark">

        <h3>Get Tasks By Project ID</h3>

        <!-- 🔍 SEARCH -->
        <form th:action="@{/tasks/project}" method="get" class="d-flex mb-3">
            <input type="number" name="projectId" class="form-control me-2" placeholder="Enter Project ID" required>
            <button class="btn btn-primary">Search</button>
        </form>

        <!-- 📋 RESULT -->
        <table class="table table-hover" th:if="${tasks}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Status</th>
                <th>Priority</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="t : ${tasks}">
                <td th:text="${t.taskID}"></td>
                <td th:text="${t.taskName}"></td>

                <!-- STATUS BADGE -->
                <td>
                    <span th:text="${t.status}"
                          th:classappend="
                            ${t.status == 'Pending'} ? 'status pending' :
                            (${t.status == 'In Progress'} ? 'status progress' :
                            'status completed')
                          ">
                    </span>
                </td>

                <td th:text="${t.priority}"></td>
            </tr>
            </tbody>
        </table>

        <!-- 🔙 BACK -->
        <div class="text-center mt-3">
            <a href="/tasks/task-endpoints" class="btn btn-secondary">Back</a>
        </div>

    </div>

</div>

</body>
</html>
