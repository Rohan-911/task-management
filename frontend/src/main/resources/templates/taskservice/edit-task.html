<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Task</title>

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .form-container {
            max-width: 950px;
            margin: 40px auto;
        }

        .form-card {
            background: #1e293b;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-title {
            text-align: center;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .form-label {
            color: #cbd5e1;
            font-weight: 500;
        }

        /* Inputs */
        .form-control {
            background: #334155;
            border: none;
            color: white;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus {
            background: #334155;
            color: white;
            box-shadow: none;
            border: 1px solid #3b82f6;
        }

        .input-group-text {
            background: #475569;
            border: none;
            color: white;
        }

        /* Remove number arrows */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none !important;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield !important;
        }

        /* Buttons */
        .btn-primary {
            background: #2563eb;
            border: none;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #64748b;
            border: none;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .row-gap {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="form-container">

    <div class="form-card">

        <h2 class="form-title">Edit Task</h2>

        <form th:action="@{/ui/tasks/update}" th:object="${task}" method="post">

            <!-- Hidden ID -->
            <input type="hidden" th:field="*{taskID}"/>

            <div class="row">

                <!-- Task Name -->
                <div class="col-md-6 row-gap">
                    <label class="form-label">Task Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                        <input type="text" th:field="*{taskName}" class="form-control"/>
                    </div>
                </div>

                <!-- Description -->
                <div class="col-md-6 row-gap">
                    <label class="form-label">Description</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-file-text"></i></span>
                        <input type="text" th:field="*{description}" class="form-control"/>
                    </div>
                </div>

            </div>

            <div class="row">

                <!-- Status -->
                <div class="col-md-6 row-gap">
                    <label class="form-label">Status</label>
                    <select th:field="*{status}" class="form-control">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <!-- Priority -->
                <div class="col-md-6 row-gap">
                    <label class="form-label">Priority</label>
                    <select th:field="*{priority}" class="form-control">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

            </div>

            <div class="row">

                <!-- User ID -->
                <div class="col-md-6 row-gap">
                    <label class="form-label">User ID</label>
                    <input type="number" th:field="*{userID}" class="form-control"/>
                </div>

                <!-- Project ID -->
                <div class="col-md-6 row-gap">
                    <label class="form-label">Project ID</label>
                    <input type="number" th:field="*{projectID}" class="form-control"/>
                </div>

            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-between mt-4">
                <a href="/ui/tasks" class="btn btn-secondary">Back</a>
                <button type="submit" class="btn btn-primary">Update Task</button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
