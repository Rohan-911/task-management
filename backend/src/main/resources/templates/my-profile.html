<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">

<div th:fragment="content">

    <div style="max-width:600px; margin:40px auto; background:white; padding:30px; 
                border-radius:12px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);">

        <h3 style="margin-bottom:5px; font-weight:700; color:#1e293b;">My Profile</h3>
        <p style="color:#64748b; margin-bottom:20px;">View and update your personal details.</p>

        <!-- Dynamic Success/Error Banners -->
        <div id="successBanner" style="display:none; background:#dcfce7; color:#15803d; padding:12px 20px; border-radius:8px; margin-bottom:20px; border-left:4px solid #22c55e;">
        </div>
        <div id="errorBanner" style="display:none; background:#fee2e2; color:#b91c1c; padding:12px 20px; border-radius:8px; margin-bottom:20px; border-left:4px solid #ef4444;">
        </div>

        <form id="profileForm" onsubmit="updateProfile(event)">
            
            <div style="margin-bottom:15px;">
                <label style="font-weight:600; color:#475569; margin-bottom:5px; display:block;">Username</label>
                <input type="text" id="username" class="form-control" style="border-radius:8px; padding:10px;" required>
            </div>

            <div style="margin-bottom:15px;">
                <label style="font-weight:600; color:#475569; margin-bottom:5px; display:block;">Email Address</label>
                <input type="email" id="email" class="form-control" style="border-radius:8px; padding:10px;" required>
            </div>

            <div style="margin-bottom:15px;">
                <label style="font-weight:600; color:#475569; margin-bottom:5px; display:block;">Full Name</label>
                <input type="text" id="fullName" class="form-control" style="border-radius:8px; padding:10px;" required>
            </div>

            <div style="margin-bottom:20px;">
                <label style="font-weight:600; color:#475569; margin-bottom:5px; display:block;">New Password (Optional)</label>
                <input type="password" id="password" class="form-control" style="border-radius:8px; padding:10px;" placeholder="Leave blank to keep current password">
            </div>

            <button type="submit" id="submitBtn" style="width:100%; background:linear-gradient(135deg,#3b82f6,#2563eb); color:white; border:none; padding:12px; border-radius:8px; font-weight:600; cursor:pointer; transition:all 0.2s;">
                Save Changes
            </button>
        </form>

    </div>

    <script>
        const token = localStorage.getItem("token");

        // On Page Load: Fetch Current User Profile
        document.addEventListener("DOMContentLoaded", function() {
            if (!token) {
                window.location.href = "/";
                return;
            }

            fetch('/api/users/me', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            })
            .then(res => {
                if (!res.ok) throw new Error("Failed to load profile. Please log in again.");
                return res.json();
            })
            .then(data => {
                document.getElementById('username').value = data.username;
                document.getElementById('email').value = data.email;
                document.getElementById('fullName').value = data.fullName;
            })
            .catch(err => {
                showError(err.message);
                if (err.message.includes("log in")) {
                    setTimeout(() => window.location.href = "/", 2000);
                }
            });
        });

        // On Form Submit: Update Profile
        function updateProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = "Saving...";
            btn.disabled = true;

            const originalUsername = localStorage.getItem("username");
            const newUsername = document.getElementById('username').value;
            const newEmail = document.getElementById('email').value;
            const newFullName = document.getElementById('fullName').value;
            const newPassword = document.getElementById('password').value;

            // Notice we do NOT send "roles" in the payload. 
            // Even if we did, the backend explicitly ignores it.
            const payload = {
                username: newUsername,
                email: newEmail,
                fullName: newFullName
            };
            if (newPassword && newPassword.trim() !== '') {
                payload.password = newPassword;
            } else {
                payload.password = "dummyPassword"; // UserService requires password, but wait!
            }

            fetch('/api/users/me', {
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(err => { 
                        throw new Error(err.message || err.error || "Failed to update profile"); 
                    });
                }
                return res.json();
            })
            .then(data => {
                showSuccess("Profile updated successfully!");
                document.getElementById('password').value = ''; 
                
                if (newUsername !== originalUsername) {
                    showSuccess("Username changed! Redirecting to login in 3 seconds...");
                    setTimeout(() => {
                        localStorage.clear();
                        window.location.href = "/";
                    }, 3000);
                }
            })
            .catch(err => {
                showError(err.message);
            })
            .finally(() => {
                btn.innerHTML = "Save Changes";
                btn.disabled = false;
            });
        }

        function showSuccess(msg) {
            const el = document.getElementById('successBanner');
            el.innerText = msg;
            el.style.display = 'block';
            document.getElementById('errorBanner').style.display = 'none';
        }

        function showError(msg) {
            const el = document.getElementById('errorBanner');
            el.innerText = msg;
            el.style.display = 'block';
            document.getElementById('successBanner').style.display = 'none';
        }
    </script>
</div>
</html>
